name: Verify TULIP 8.1 examples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [github-api, taiga-api, taiga-readonly]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve TULIP from Maven Central and compile
        working-directory: examples/${{ matrix.example }}
        run: mvn --batch-mode --no-transfer-progress clean verify
