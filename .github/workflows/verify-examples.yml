name: Verify TULIP 8.0 examples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and verify against Maven Central
        run: mvn --batch-mode --no-transfer-progress clean verify
